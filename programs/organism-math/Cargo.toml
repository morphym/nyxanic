[package]
name = "organism-brain"
version = "0.1.0"
description = "The Organism — Contract B (the brain), on-chain"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "organism_brain"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
organism-math = { path = "./organism" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
