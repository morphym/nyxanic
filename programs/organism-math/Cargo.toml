[package]
name = "organism-math"
version = "0.1.0"
description = "The Organism — Contract B (the brain)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "organism_math"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
organism-shared = { path = "../organism-shared" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
