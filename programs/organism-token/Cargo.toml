[package]
name = "organism-token"
version = "0.1.0"
description = "The Organism — Contract A (the body)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "organism_token"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
organism-brain = { path = "../organism-math", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
